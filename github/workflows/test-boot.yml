name: Test MiOS Boot (QEMU)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  test-boot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install QEMU
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-mips

    - name: Download Artifacts (Kernel & RootFS)
      uses: actions/download-artifact@v4
      with:
        name: mios-kernel-image
        path: ./kernel_dir
      continue-on-error: true # لو الملفات مش مرفوعة في نفس الـ run، هنعمل تخطي

    - name: Run QEMU Test
      run: |
        echo "Starting the virtual machine test..."
        # هنشغل المحاكي في الخلفية لمدة 30 ثانية عشان نشوف هو بيقلع ولا بيضرب
        timeout 30s qemu-system-mipsel -M malta -m 256 -kernel kernel_dir/vmlinux -initrd rootfs.cpio.gz -append "console=ttyS0" -nographic > qemu_output.txt 2>&1 || true
        
        echo "--- Testing output ---"
        cat qemu_output.txt
        echo "----------------------"
        
        # التأكد من ظهور رسالة النجاح
        if grep -q "Welcome to MiOS Linux!" qemu_output.txt; then
          echo "✅ TEST PASSED: MiOS booted successfully!"
        else
          echo "❌ TEST FAILED: System did not boot properly."
          exit 1
        fi
