name: Package Boot Image for MiOS

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install U-Boot Tools
      run: sudo apt-get update && sudo apt-get install -y u-boot-tools

    - name: Download Previous Artifacts
      uses: actions/download-artifact@v4
      with:
        name: mios-kernel-image
        path: ./artifacts/kernel

    - name: Download RootFS Artifact
      uses: actions/download-artifact@v4
      with:
        name: mios-rootfs
        path: ./artifacts/rootfs

    - name: Create U-Boot Image (uImage)
      run: |
        # تجهيز النواة
        cp artifacts/kernel/vmlinux ./vmlinux
        # تغليف النواة في صيغة uImage لمعالجات MIPS
        mkimage -A mips -O linux -T kernel -C gzip -a 0x80010000 -e 0x80010000 -n "MiOS" -d vmlinux uImage
        
    - name: Upload Final Boot Package
      uses: actions/upload-artifact@v4
      with:
        name: MiOS-Final-Boot
        path: |
          uImage
          artifacts/rootfs/rootfs.cpio.gz
