name: Build MiOS RootFS

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Prepare Minimal RootFS
      run: |
        # إنشاء فولدرات النظام الأساسية
        mkdir -p rootfs/bin rootfs/dev rootfs/proc rootfs/sys rootfs/etc rootfs/www
        
        # إنشاء ملف init (أول حاجة بتشتغل في لينكس)
        cat << 'EOF' > rootfs/init
        #!/bin/sh
        mount -t proc none /proc
        mount -t sysfs none /sys
        echo "Welcome to MiOS Linux!"
        echo "System is ready."
        exec /bin/sh
        EOF
        chmod +x rootfs/init
        
        # وضع ملف الواجهة التجريبي (في الخطوة الجاية هنحط الواجهة الحقيقية)
        echo "<h1>MiOS UI Loading...</h1><p>Everything is working!</p>" > rootfs/www/index.html

    - name: Package RootFS
      run: |
        # ضغط ملفات النظام في ملف واحد
        cd rootfs
        find . | cpio -o -H newc | gzip -9 > ../rootfs.cpio.gz

    - name: Upload RootFS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mios-rootfs
        path: rootfs.cpio.gz
