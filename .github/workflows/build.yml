name: Build MiOS Kernel (in Docker)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build Kernel inside Docker (Ubuntu 16.04)
      run: |
        docker run --rm -v ${{ github.workspace }}:/work -w /work ubuntu:16.04 /bin/bash -c "
          apt-get update && \
          apt-get install -y gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu bc flex bison libssl-dev libncurses5-dev make && \
          cd linux-4.4.7 && \
          make ARCH=mips CROSS_COMPILE=mipsel-linux-gnu- sphe15xx_defconfig && \
          make ARCH=mips CROSS_COMPILE=mipsel-linux-gnu- -j\$(nproc)
        "

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mips-kernel-image
        path: |
          linux-4.4.7/arch/mips/boot/vmlinux.bin
          linux-4.4.7/arch/mips/boot/uImage
