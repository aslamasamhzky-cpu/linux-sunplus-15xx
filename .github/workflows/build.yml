name: Build MiOS Kernel

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Cross-Compiler and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu bc flex bison libssl-dev libncurses5-dev

    - name: Configure Kernel
      run: |
        cd linux-4.4.7
        make ARCH=mips CROSS_COMPILE=mipsel-linux-gnu- sphe15xx_defconfig

    - name: Build Kernel
      run: |
        cd linux-4.4.7
        # التعديل السحري: إجبار النظام على استخدام fcommon في كل حاجة
        make ARCH=mips CROSS_COMPILE=mipsel-linux-gnu- CFLAGS="-fcommon" HOSTCFLAGS="-fcommon" -j$(nproc)

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mips-kernel-image
        path: |
          linux-4.4.7/arch/mips/boot/vmlinux.bin
          linux-4.4.7/arch/mips/boot/uImage
